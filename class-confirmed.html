<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theresa Stone Creative — Class Checkout Result</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&amp;family=Raleway:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07060D}
a{color:#FDFEFF;text-decoration:none}a:hover{color:#C9A24E}
.navlink:hover{color:#C9A24E}
.navlink.inst:hover{color:#D5D8E0}
.btn-gold:hover{background:#FDFEFF;color:#07060D}
.btn-line:hover{border-color:#C9A24E;color:#C9A24E}
@media (max-width: 760px){.nav-links{flex-wrap:nowrap!important;overflow-x:auto;width:100%;gap:28px!important;padding-bottom:8px;scrollbar-width:none}.nav-links::-webkit-scrollbar{display:none}.nav-links a{flex:0 0 auto;white-space:nowrap}}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="font-family: Raleway, system-ui, sans-serif; color: #FDFEFF; background: #07060D">

<nav aria-label="Main" style="border-bottom: 1px solid #1d1b26">
  <div style="max-width: 1344px; margin: 0 auto; padding: 28px clamp(20px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between">
    <a href="index.html" aria-label="Theresa Stone Creative — home"><img src="assets/theresa-stone-creative-long.png" alt="Theresa Stone Creative" style="display: block; width: 240px; height: auto"></a>
    <div class="nav-links" style="display: flex; flex-wrap: wrap; gap: 36px; font-size: 13px; font-weight: 700; letter-spacing: 0.18em">
      <a class="navlink" href="creative-work.html">CREATIVE WORK</a>
      <a class="navlink" href="classes.html" aria-current="page" style="color: #C9A24E; border-bottom: 1px solid #C9A24E; padding-bottom: 6px">CLASSES</a>
      <a class="navlink inst" href="instincts.html">INSTINCTS</a>
      <a class="navlink" href="contact.html">CONTACT</a>
    </div>
  </div>
</nav>

<main style="max-width: 880px; margin: 0 auto; padding: 96px clamp(20px, 4vw, 48px) 112px; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center">

  <!-- SUCCESS -->
  <sc-if value="{{paid}}" hint-placeholder-val="{{true}}">
    <span style="width: 76px; height: 76px; border-radius: 50%; border: 1px solid #C9A24E; color: #C9A24E; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.32em; color: #C9A24E">PAYMENT CONFIRMED</span>
    <h1 style="margin: 0; font-family: 'Bodoni Moda', 'Bodoni 72', serif; font-weight: 400; font-size: clamp(56px, 8vw, 104px); line-height: 0.95">YOU'RE IN</h1>
    <p style="margin: 0; max-width: 560px; font-size: 18px; line-height: 1.6; color: #A6AAB6">See you in class, [First name]. Your confirmation and receipt are on their way to [email address].</p>

    <div style="width: 100%; margin-top: 16px; border: 1px solid #22202c; background: #0E0C15; padding: clamp(24px, 4vw, 40px); box-sizing: border-box; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 28px 32px; text-align: left">
      <div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; padding-bottom: 24px; border-bottom: 1px solid #2a2834">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.24em; color: #A6AAB6">YOUR CLASS</span>
        <span style="font-size: 24px; font-weight: 600; letter-spacing: 0.06em">[CLASS TITLE]</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.24em; color: #C9A24E">DATE &amp; TIME</span><span style="font-size: 16px; line-height: 1.5">[Saturday, November 7]<br>[Time]</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.24em; color: #C9A24E">LOCATION</span><span style="font-size: 16px; line-height: 1.5">[Studio name]<br>[Street address, City]</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.24em; color: #C9A24E">AMOUNT PAID</span><span style="font-size: 16px; line-height: 1.5">[$ Total]</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.24em; color: #C9A24E">CONFIRMATION #</span><span style="font-size: 16px; line-height: 1.5">[TS-000000]</span></div>
      <div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 12px; padding-top: 24px; border-top: 1px solid #2a2834">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.24em; color: #A6AAB6">BEFORE CLASS</span>
        <ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.5; color: #E6E7EC">
          <li>[Arrive 10 minutes early to warm up]</li>
          <li>[What to wear / bring]</li>
          <li>[Parking or entry details]</li>
        </ul>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 12px">
      <a href="#" class="btn-line" style="min-height: 52px; display: inline-flex; align-items: center; gap: 10px; padding: 0 28px; border: 1px solid #3a3846; font-size: 12px; font-weight: 700; letter-spacing: 0.22em"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="1"></rect><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"></path></svg>ADD TO CALENDAR</a>
      <a href="classes.html" class="btn-gold" style="min-height: 52px; display: inline-flex; align-items: center; padding: 0 32px; background: #C9A24E; color: #07060D; font-size: 12px; font-weight: 700; letter-spacing: 0.22em">BACK TO CLASSES</a>
    </div>
    <p style="margin: 0; font-size: 14px; color: #8A8E9A">Need to cancel or change? <a href="contact.html" style="color: #C9A24E">Contact Theresa</a> · [cancellation policy summary]</p>
  </sc-if>

  <!-- CANCELLED / NOT COMPLETED -->
  <sc-if value="{{notPaid}}" hint-placeholder-val="{{false}}">
    <span style="width: 76px; height: 76px; border-radius: 50%; border: 1px solid #A6AAB6; color: #A6AAB6; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 7v6M12 16.5v.5"></path></svg></span>
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.32em; color: #A6AAB6">PAYMENT NOT COMPLETED</span>
    <h1 style="margin: 0; font-family: 'Bodoni Moda', 'Bodoni 72', serif; font-weight: 400; font-size: clamp(48px, 7vw, 88px); line-height: 0.95">NO CHARGE MADE</h1>
    <p style="margin: 0; max-width: 560px; font-size: 18px; line-height: 1.6; color: #A6AAB6">Checkout wasn't finished, so your spot isn't reserved yet and nothing was charged. Spots are first come, first served.</p>
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 12px">
      <a href="classes.html" class="btn-gold" style="min-height: 52px; display: inline-flex; align-items: center; padding: 0 32px; background: #C9A24E; color: #07060D; font-size: 12px; font-weight: 700; letter-spacing: 0.22em">TRY CHECKOUT AGAIN</a>
      <a href="classes.html" class="btn-line" style="min-height: 52px; display: inline-flex; align-items: center; padding: 0 28px; border: 1px solid #3a3846; font-size: 12px; font-weight: 700; letter-spacing: 0.22em">BACK TO CLASSES</a>
    </div>
    <p style="margin: 0; font-size: 14px; color: #8A8E9A">Having trouble paying? <a href="contact.html" style="color: #C9A24E">Contact Theresa</a></p>
  </sc-if>
</main>

<footer style="border-top: 1px solid #1d1b26">
  <div style="max-width: 1344px; margin: 0 auto; padding: 64px clamp(20px, 4vw, 48px) 48px; display: flex; flex-direction: column; gap: 48px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 32px">
      <img src="assets/theresa-stone-creative-long.png" alt="Theresa Stone Creative" style="display: block; width: 260px; height: auto">
      <div style="display: flex; flex-wrap: wrap; gap: 32px; font-size: 12px; font-weight: 700; letter-spacing: 0.2em">
        <a class="navlink" href="creative-work.html">CREATIVE WORK</a><a class="navlink" href="classes.html">CLASSES</a><a class="navlink inst" href="instincts.html">INSTINCTS</a><a class="navlink" href="contact.html">CONTACT</a>
      </div>
      <div style="display: flex; gap: 8px">
        <a href="https://instagram.com/theresastone91" aria-label="Instagram" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #3a3846; border-radius: 50%"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.6"></circle></svg></a>
        <a href="https://youtube.com/@theresastone5205" aria-label="YouTube" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #3a3846; border-radius: 50%"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4"></rect><path d="M10 9v6l5-3z"></path></svg></a>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 12px; letter-spacing: 0.12em; color: #8A8E9A">
      <span>© 2026 THERESA STONE. ALL RIGHTS RESERVED.</span><span>SITE BY <a href="https://bumpstudio.co" style="color: inherit; text-decoration: underline; text-underline-offset: 3px">BUMP STUDIO</a></span>
    </div>
  </div>
</footer>
</div>
</template>
<script type="text/x-dc" id="dc-script" data-props='{"paymentCompleted":{"editor":"boolean","default":true,"section":"Page state"},"$preview":{"width":1440,"height":1580}}'>
class Component extends DCLogic {
  renderVals() {
    const paid = this.props.paymentCompleted ?? true;
    return { paid, notPaid: !paid };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
