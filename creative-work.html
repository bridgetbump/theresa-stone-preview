<script type="text/x-dc" id="dc-script" data-props='{"$preview":{"width":1440,"height":5130}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { playing: null, rot: 0, anim: 0 }; }
  goFull(e) {
    try {
      const v = e.currentTarget.closest('.feat-video');
      const fn = v.requestFullscreen || v.webkitRequestFullscreen;
      if (fn) fn.call(v);
    } catch (err) {}
  }
  rotateTo(rot, n, e) {
    this.setState((s) => ({ rot: ((rot % n) + n) % n, anim: s.anim + 1, playing: 'feat' }));
    try {
      const el = e && e.currentTarget && e.currentTarget.ownerDocument.getElementById('featured');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {}
  }
  renderVals() {
    const d = this.baseVals();
    const all = d.pro;
    const n = all.length;
    const rot = this.state.rot;
    const order = all.slice(rot).concat(all.slice(0, rot));
    const feat = order[0];
    const animCls = this.state.anim === 0 ? '' : (this.state.anim % 2 ? 'snA' : 'snB');
    return {
      feat,
      featCount: String(rot + 1).padStart(2, '0') + ' / ' + String(n).padStart(2, '0'),
      animCls,
      prevFeat: () => this.setState((s) => ({ rot: (s.rot - 1 + n) % n, anim: s.anim + 1, playing: null })),
      nextFeat: () => this.setState((s) => ({ rot: (s.rot + 1) % n, anim: s.anim + 1, playing: null })),
      featIdle: this.state.playing !== 'feat',
      featPlaying: this.state.playing === 'feat',
      featBorder: this.state.playing === 'feat' ? '#C9A24E' : 'transparent',
      playFeat: () => this.setState({ playing: 'feat' }),
      stopPlay: () => this.setState({ playing: null }),
      fullscreen: (e) => this.goFull(e),
      pro: order.slice(1).map((p, i) => ({
        ...p,
        delay: (80 + i * 70) + 'ms',
        pick: (e) => { if (e && e.preventDefault) e.preventDefault(); this.rotateTo(rot + i + 1, n, e); }
      })),
      concepts: d.concepts.map((c, i) => {
        const on = this.state.playing === 'c' + i;
        return { ...c, idle: !on, playing: on, border: on ? '#C9A24E' : 'transparent', play: () => this.setState({ playing: 'c' + i }) };
      })
    };
  }
  baseVals() {
    return {
      pro: [
        { client: 'ALICIA KEYS', title: '[Project title]', role: 'Choreographer', year: '[Year]' },
        { client: 'NIKE', title: '[Campaign title]', role: 'Choreographer', year: '[Year]' },

      ],
