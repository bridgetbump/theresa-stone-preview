<style>
body{margin:0;background:#07060D}
a{color:#FDFEFF;text-decoration:none}a:hover{color:#E8C9B8}
.logo-w{filter:invert(1);mix-blend-mode:screen;display:block}
.navlink:hover{color:#C9A24E}
.navlink.inst:hover{color:#D5D8E0}
.btn-glow:hover{filter:brightness(1.12)}
.btn-line:hover{border-color:#FDFEFF}
input::placeholder,textarea::placeholder{color:#8A8E9A}
.silver-logo{isolation:isolate;mix-blend-mode:screen;position:relative;display:block}
.sl-img{filter:invert(1);display:block;width:100%;height:auto}
.sl-tint{mix-blend-mode:multiply;position:absolute;inset:0}
@media (max-width: 760px){.pillars{grid-template-columns:minmax(0,1fr) !important}}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}

@media (max-width: 760px){.nav-links{flex-wrap:nowrap!important;overflow-x:auto;width:100%;gap:28px!important;padding-bottom:8px;scrollbar-width:none}.nav-links::-webkit-scrollbar{display:none}.nav-links a{flex:0 0 auto;white-space:nowrap}}
nav{timeline-scope:--navx}
.nav-track{display:none}
@media (max-width: 760px){.nav-links{padding-right:32px;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent);scroll-timeline:--navx inline}.nav-track{display:block;position:relative;width:100%;height:2px;margin-top:-6px;background:rgba(253,254,255,.15);overflow:hidden}.nav-thumb{position:absolute;left:0;top:0;height:100%;width:38%;background:#D5D8E0}@supports (animation-timeline: scroll()){.nav-thumb{animation:navThumb linear both;animation-timeline:--navx}}}
@keyframes navThumb{from{left:0}to{left:62%}}
@media (min-width: 1025px){nav[aria-label="Main"]{padding-top:64px!important}}
@media (min-width: 1025px){nav[aria-label="Main"]{align-items:flex-start!important}nav[aria-label="Main"] .nav-links{padding-top:0;line-height:1;margin-top:-1px}}
@media (max-width: 760px){.pill{flex-direction:column;gap:6px!important;border-radius:28px!important;padding:14px 22px!important;font-size:11px!important;letter-spacing:.14em!important}.pill-sep{display:none}.foot-links{flex-direction:column;gap:20px!important}a[aria-label="Theresa Stone Creative — home"]{flex:1 1 100%}a[aria-label="Theresa Stone Creative — home"] img{width:min(351px,100%)!important}}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="font-family: Raleway, system-ui, sans-serif; color: #FDFEFF; min-height: 100vh; background: radial-gradient(1300px 1000px at 0% 100%, rgba(166,63,112,.38), rgba(166,63,112,0) 72%), radial-gradient(1500px 1200px at 0% 0%, rgba(166,63,112,.62), rgba(166,63,112,0) 72%), radial-gradient(1500px 1500px at 100% 20%, rgba(183,91,56,.45), rgba(183,91,56,0) 72%), radial-gradient(1500px 1500px at 0% 42%, rgba(166,63,112,.42), rgba(166,63,112,0) 72%), radial-gradient(1500px 1500px at 100% 64%, rgba(183,91,56,.42), rgba(183,91,56,0) 72%), radial-gradient(1500px 1500px at 0% 86%, rgba(166,63,112,.4), rgba(166,63,112,0) 72%), radial-gradient(1400px 1100px at 100% 100%, rgba(183,91,56,.5), rgba(183,91,56,0) 72%), #07060D">

<!-- HERO -->
<header style="position: relative; overflow: hidden">
  <nav aria-label="Main" style="max-width: 1344px; margin: 0 auto; padding: 28px clamp(20px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between">
    <a href="index.html" aria-label="Theresa Stone Creative — home"><img src="assets/theresa-stone-creative-long.png" alt="Theresa Stone Creative" style="filter: brightness(0) invert(1);display: block;width: 260px; height: auto"></a>
    <div class="nav-links" style="display: flex; flex-wrap: wrap; gap: 36px; font-size: 13px; font-weight: 700; letter-spacing: 0.18em">
      <a class="navlink" href="creative-work.html">CREATIVE WORK</a>
      <a class="navlink" href="classes.html">CLASSES</a>
      <a class="navlink inst" href="instincts.html" aria-current="page" style="color: #D5D8E0; border-bottom: 1px solid #D5D8E0; padding-bottom: 6px">INSTINCTS</a>
      <a class="navlink" href="contact.html">CONTACT</a>
    </div>
    <div class="nav-track" aria-hidden="true"><span class="nav-thumb"></span></div>
  </nav>
  <div style="max-width: 1100px; margin: 0 auto; padding: 80px clamp(20px, 4vw, 48px) 64px; display: flex; flex-direction: column; align-items: center; gap: 36px; text-align: center">
    <h1 style="margin: 0"><span class="inst-logo" style="position: relative; display: block; width: min(720px, 86vw)"><img src="assets/instincts-wordmark-silver.png" alt="INSTINCTS by Theresa Stone" style="display: block; width: 100%; height: auto"><span class="inst-shine" aria-hidden="true"></span></span></h1>
    <p style="margin: 0; font-size: clamp(20px, 2.2vw, 28px); font-weight: 500; letter-spacing: 0.22em">A RETRAINING FOR YOUR BRAIN</p>
    <sc-if value="{{closed}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 40px">
        <span class="pill" style="display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border: 1px solid rgba(253,254,255,.35); border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.24em"><span>INSTINCTS 2027</span><span class="pill-sep">·</span><span>SUBMISSIONS OPEN NOVEMBER 2026</span></span>
        <a href="#apply" class="btn-glow" style="min-height: 56px; display: inline-flex; align-items: center; padding: 0 38px; background: linear-gradient(90deg, #A63F70, #B75B38); color: #FDFEFF; font-size: 13px; font-weight: 700; letter-spacing: 0.24em">GET NOTIFIED</a>
      </div>
    </sc-if>
    <sc-if value="{{open}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 40px">
        <span class="pill" style="display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border: 1px solid rgba(253,254,255,.35); border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.24em"><span>INSTINCTS 2027</span><span class="pill-sep">·</span><span>SUBMISSIONS NOW OPEN · CLOSE [DATE]</span></span>
        <a href="#apply" class="btn-glow" style="min-height: 56px; display: inline-flex; align-items: center; padding: 0 38px; background: linear-gradient(90deg, #A63F70, #B75B38); color: #FDFEFF; font-size: 13px; font-weight: 700; letter-spacing: 0.24em">APPLY NOW</a>
      </div>
    </sc-if>
  </div>
</header>

<!-- WHAT IT IS -->
<section style="max-width: 1344px; margin: 0 auto; padding: 139px clamp(20px, 4vw, 48px) 100px; display: flex; flex-wrap: wrap; gap: 72px">
  <div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 18px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.32em; color: #A6AAB6">THE PROGRAM</span>
    <h2 style="margin: 0; font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: clamp(44px, 5vw, 72px); line-height: 1">TRAIN THE<br>MIND THAT<br>MOVES YOU</h2>
  </div>
  <div style="flex: 1.3 1 480px; display: flex; flex-direction: column; gap: 24px; font-size: 19px; line-height: 1.65; color: #E6E7EC">
    <p style="margin: 0">INSTINCTS is Theresa Stone's program for dancers. It teaches the mentalities and healthy practices that carry you through the studio, the audition room and the set, and into everyday life.</p>
    <p style="margin: 0; color: #A6AAB6">[Two or three more sentences from Theresa: why she created INSTINCTS, what makes it different from a technique intensive, and the shift she wants dancers to leave with.]</p>
  </div>
</section>

<!-- PILLARS -->
<section style="max-width: 1344px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px) 130px">
  <div class="pillars" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <div style="padding: 40px 34px; border: 1px solid rgba(253,254,255,.12); background: rgba(7,6,13,.35); display: flex; flex-direction: column; gap: 56px; min-height: 300px; box-sizing: border-box">
      <span style="font-family: 'Bodoni Moda', serif; font-size: 22px; color: #A6AAB6">01</span>
      <div style="display: flex; flex-direction: column; gap: 12px"><span style="font-size: 20px; font-weight: 600; letter-spacing: 0.12em">[PILLAR ONE]</span><span style="font-size: 15px; line-height: 1.55; color: #A6AAB6">[What dancers work on here, in one or two lines.]</span></div>
    </div>
    <div style="padding: 40px 34px; border: 1px solid rgba(253,254,255,.12); background: rgba(7,6,13,.35); display: flex; flex-direction: column; gap: 56px; min-height: 300px; box-sizing: border-box">
      <span style="font-family: 'Bodoni Moda', serif; font-size: 22px; color: #A6AAB6">02</span>
      <div style="display: flex; flex-direction: column; gap: 12px"><span style="font-size: 20px; font-weight: 600; letter-spacing: 0.12em">[PILLAR TWO]</span><span style="font-size: 15px; line-height: 1.55; color: #A6AAB6">[What dancers work on here, in one or two lines.]</span></div>
    </div>
    <div style="padding: 40px 34px; border: 1px solid rgba(253,254,255,.12); background: rgba(7,6,13,.35); display: flex; flex-direction: column; gap: 56px; min-height: 300px; box-sizing: border-box">
      <span style="font-family: 'Bodoni Moda', serif; font-size: 22px; color: #A6AAB6">03</span>
      <div style="display: flex; flex-direction: column; gap: 12px"><span style="font-size: 20px; font-weight: 600; letter-spacing: 0.12em">[PILLAR THREE]</span><span style="font-size: 15px; line-height: 1.55; color: #A6AAB6">[What dancers work on here, in one or two lines.]</span></div>
    </div>
  </div>
</section>

<!-- DETAILS -->
<section style="border-top: 1px solid rgba(253,254,255,.08); border-bottom: 1px solid rgba(253,254,255,.08); background: rgba(7,6,13,.35)">
  <div style="max-width: 1344px; margin: 0 auto; padding: 72px clamp(20px, 4vw, 48px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.28em; color: #A6AAB6">WHO IT'S FOR</span><span style="font-size: 17px; line-height: 1.5">Dancers · [age / level]</span></div>
    <div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.28em; color: #A6AAB6">FORMAT</span><span style="font-size: 17px; line-height: 1.5">In person · [length]</span></div>
    <div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.28em; color: #A6AAB6">DATES</span><span style="font-size: 17px; line-height: 1.5">[2027 program dates]</span></div>
    <div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.28em; color: #A6AAB6">LOCATION</span><span style="font-size: 17px; line-height: 1.5">[City / venue]</span></div>
    <div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.28em; color: #A6AAB6">TUITION</span><span style="font-size: 17px; line-height: 1.5">[Price / scholarships]</span></div>
  </div>
</section>

<!-- APPLY / NOTIFY -->
<section id="apply" style="max-width: 1344px; margin: 0 auto; padding: 120px clamp(20px, 4vw, 48px) 120px">
  <div style="border: 1px solid rgba(253,254,255,.12); background: rgba(7,6,13,.35); padding: clamp(32px, 5vw, 72px)">
    <sc-if value="{{closed}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
        <div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 18px">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.32em; color: #E6E7EC">SUBMISSIONS OPEN NOVEMBER 2026</span>
          <h2 style="margin: 0; font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: clamp(40px, 4.6vw, 64px); line-height: 1">DON'T MISS<br>THE WINDOW</h2>
          <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #C9CCD4">Get an email the moment INSTINCTS 2027 submissions open.</p>
        </div>
        <form style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 12px">
          <label for="in-name" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #C9CCD4">NAME</label>
          <input id="in-name" type="text" style="min-height: 52px; padding: 0 18px; background: rgba(7,6,13,.7); border: 1px solid #4a3a4c; color: #FDFEFF; font-family: inherit; font-size: 15px">
          <label for="in-email" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #C9CCD4">EMAIL</label>
          <input id="in-email" type="email" style="min-height: 52px; padding: 0 18px; background: rgba(7,6,13,.7); border: 1px solid #4a3a4c; color: #FDFEFF; font-family: inherit; font-size: 15px">
          <button type="submit" class="btn-glow" style="margin-top: 20px; min-height: 56px; background: linear-gradient(90deg, #A63F70, #B75B38); color: #FDFEFF; border: 0; font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.24em; cursor: pointer">NOTIFY ME</button>
        </form>
      </div>
    </sc-if>
    <sc-if value="{{open}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 40px">
        <div style="display: flex; flex-direction: column; gap: 16px">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.32em; color: #E6E7EC">SUBMISSIONS CLOSE [DATE]</span>
          <h2 style="margin: 0; font-family: 'Bodoni Moda', serif; font-weight: 400; font-size: clamp(40px, 4.6vw, 64px); line-height: 1">APPLY TO INSTINCTS 2027</h2>
        </div>
        <form style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 22px 20px">
          <div style="display: flex; flex-direction: column; gap: 10px"><label for="a-name" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #C9CCD4">FULL NAME</label><input id="a-name" type="text" style="min-height: 52px; padding: 0 18px; background: rgba(7,6,13,.7); border: 1px solid #4a3a4c; color: #FDFEFF; font-family: inherit; font-size: 15px"></div>
          <div style="display: flex; flex-direction: column; gap: 10px"><label for="a-email" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #C9CCD4">EMAIL</label><input id="a-email" type="email" style="min-height: 52px; padding: 0 18px; background: rgba(7,6,13,.7); border: 1px solid #4a3a4c; color: #FDFEFF; font-family: inherit; font-size: 15px"></div>
          <div style="display: flex; flex-direction: column; gap: 10px"><label for="a-ig" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #C9CCD4">INSTAGRAM HANDLE</label><input id="a-ig" type="text" placeholder="@" style="min-height: 52px; padding: 0 18px; background: rgba(7,6,13,.7); border: 1px solid #4a3a4c; color: #FDFEFF; font-family: inherit; font-size: 15px"></div>
          <div style="display: flex; flex-direction: column; gap: 10px"><label for="a-city" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #C9CCD4">CITY</label><input id="a-city" type="text" style="min-height: 52px; padding: 0 18px; background: rgba(7,6,13,.7); border: 1px solid #4a3a4c; color: #FDFEFF; font-family: inherit; font-size: 15px"></div>
          <div style="display: flex; flex-direction: column; gap: 10px"><label for="a-years" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #C9CCD4">YEARS TRAINING</label><select id="a-years" style="min-height: 52px; padding: 0 14px; background: #0B0A11; border: 1px solid #4a3a4c; color: #FDFEFF; font-family: inherit; font-size: 15px"><option>0–2</option><option>3–5</option><option>6–10</option><option>10+</option></select></div>
          <div style="display: flex; flex-direction: column; gap: 10px"><label for="a-video" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #C9CCD4">VIDEO SUBMISSION LINK</label><input id="a-video" type="url" placeholder="YouTube, Vimeo or Drive link" style="min-height: 52px; padding: 0 18px; background: rgba(7,6,13,.7); border: 1px solid #4a3a4c; color: #FDFEFF; font-family: inherit; font-size: 15px"></div>
          <div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px"><label for="a-why" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #C9CCD4">WHY INSTINCTS, WHY NOW?</label><textarea id="a-why" rows="5" style="padding: 16px 18px; background: rgba(7,6,13,.7); border: 1px solid #4a3a4c; color: #FDFEFF; font-family: inherit; font-size: 15px; line-height: 1.5; resize: vertical"></textarea></div>
          <button type="submit" class="btn-glow" style="grid-column: 1 / -1; min-height: 56px; background: linear-gradient(90deg, #A63F70, #B75B38); color: #FDFEFF; border: 0; font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.24em; cursor: pointer">SUBMIT APPLICATION</button>
        </form>
      </div>
    </sc-if>
  </div>
</section>

<!-- PAST INSTINCTS -->
<section style="border-top: 1px solid rgba(253,254,255,.08)">
  <div style="max-width: 1344px; margin: 0 auto; padding: 120px clamp(20px, 4vw, 48px); display: flex; flex-direction: column; gap: 44px">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.32em; color: #A6AAB6">INSIDE INSTINCTS</span>
      <h2 style="margin: 0; font-family: Raleway, sans-serif; font-weight: 500; font-size: 36px; letter-spacing: 0.06em">FROM PAST PROGRAMS</h2>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 24px">
      <div style="aspect-ratio: 4 / 5; background: rgba(7,6,13,.45); border: 1px solid rgba(253,254,255,.12); display: flex; align-items: flex-end; padding: 20px; box-sizing: border-box"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #A6AAB6">VIDEO OR PHOTO</span></div>
      <div style="aspect-ratio: 4 / 5; background: rgba(7,6,13,.45); border: 1px solid rgba(253,254,255,.12); display: flex; align-items: flex-end; padding: 20px; box-sizing: border-box"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #A6AAB6">VIDEO OR PHOTO</span></div>
      <div style="aspect-ratio: 4 / 5; background: rgba(7,6,13,.45); border: 1px solid rgba(253,254,255,.12); display: flex; align-items: flex-end; padding: 20px; box-sizing: border-box"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #A6AAB6">VIDEO OR PHOTO</span></div>
    </div>
    <figure style="margin: 24px 0 0; max-width: 860px; display: flex; flex-direction: column; gap: 18px">
      <blockquote style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: clamp(26px, 3vw, 38px); line-height: 1.3">“[A short quote from a past INSTINCTS dancer.]”</blockquote>
      <figcaption style="font-size: 12px; font-weight: 700; letter-spacing: 0.24em; color: #A6AAB6">[NAME] · INSTINCTS [YEAR]</figcaption>
    </figure>
  </div>
</section>

<!-- FAQ -->
<section style="border-top: 1px solid rgba(253,254,255,.08)">
  <div style="max-width: 1000px; margin: 0 auto; padding: 120px clamp(20px, 4vw, 48px); display: flex; flex-direction: column; gap: 32px">
    <h2 style="margin: 0; font-family: Raleway, sans-serif; font-weight: 500; font-size: 36px; letter-spacing: 0.06em">QUESTIONS</h2>
    <div style="display: flex; flex-direction: column">
      <details open="" style="border-top: 1px solid rgba(253,254,255,.22); padding: 24px 0"><summary style="font-size: 18px; font-weight: 600; letter-spacing: 0.06em; min-height: 44px; display: flex; align-items: center; justify-content: space-between">Who can apply?<span aria-hidden="true" style="color: #A6AAB6">−</span></summary><p style="margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #A6AAB6">[Answer]</p></details>
