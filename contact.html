<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theresa Stone Creative — Contact</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&amp;family=Raleway:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07060D}
a{color:#FDFEFF;text-decoration:none}a:hover{color:#C9A24E}
.logo-w{filter:invert(1);mix-blend-mode:screen;display:block}
.navlink:hover{color:#C9A24E}
.navlink.inst:hover{color:#D5D8E0}
.btn-gold:hover{background:#FDFEFF;color:#07060D}
.btn-line:hover{border-color:#C9A24E;color:#C9A24E}
input::placeholder,textarea::placeholder{color:#8A8E9A}
@media (max-width: 760px){.nav-links{flex-wrap:nowrap!important;overflow-x:auto;width:100%;gap:28px!important;padding-bottom:8px;scrollbar-width:none}.nav-links::-webkit-scrollbar{display:none}.nav-links a{flex:0 0 auto;white-space:nowrap}}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="font-family: Raleway, system-ui, sans-serif; color: #FDFEFF; background: #07060D">

<nav aria-label="Main" style="border-bottom: 1px solid #1d1b26">
  <div style="max-width: 1344px; margin: 0 auto; padding: 28px clamp(20px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between">
    <a href="index.html" aria-label="Theresa Stone Creative — home"><img src="assets/theresa-stone-creative-long.png" alt="Theresa Stone Creative" style="display: block;width: 240px; height: auto"></a>
    <div class="nav-links" style="display: flex; flex-wrap: wrap; gap: 36px; font-size: 13px; font-weight: 700; letter-spacing: 0.18em">
      <a class="navlink" href="creative-work.html">CREATIVE WORK</a>
      <a class="navlink" href="classes.html">CLASSES</a>
      <a class="navlink inst" href="instincts.html">INSTINCTS</a>
      <a class="navlink" href="contact.html" aria-current="page" style="color: #C9A24E; border-bottom: 1px solid #C9A24E; padding-bottom: 6px">CONTACT</a>
    </div>
  </div>
</nav>

<main style="max-width: 1344px; margin: 0 auto; padding: 96px clamp(20px, 4vw, 48px) 96px; display: flex; flex-wrap: wrap; gap: 96px">
  <div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 18px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.32em; color: #C9A24E">CONTACT</span>
      <h1 style="margin: 0; font-family: 'Bodoni Moda', 'Bodoni 72', serif; font-weight: 400; font-size: clamp(56px, 7vw, 104px); line-height: 0.95">LET'S<br>CREATE</h1>
      <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #A6AAB6; max-width: 420px">Choreography, creative direction, workshops or INSTINCTS. Tell Theresa what you're making.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 26px; border-top: 1px solid #2a2834; padding-top: 32px">
      <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.28em; color: #C9A24E">EMAIL</span><a href="#" style="font-size: 17px">[theresa@email.com]</a></div>
      <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.28em; color: #C9A24E">REPRESENTATION</span><span style="font-size: 17px; color: #E6E7EC">[Agency / agent name, if any]</span></div>
      <div style="display: flex; flex-direction: column; gap: 12px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.28em; color: #C9A24E">FOLLOW</span>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <a href="https://instagram.com/theresastone91" style="min-height: 44px; display: flex; align-items: center; gap: 12px; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.6"></circle></svg>@theresastone91</a>
          <a href="https://youtube.com/@theresastone5205" style="min-height: 44px; display: flex; align-items: center; gap: 12px; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4"></rect><path d="M10 9v6l5-3z"></path></svg>YouTube</a>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 12px">
        <a href="#" class="btn-line" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 20px; border: 1px solid #3a3846; font-size: 11px; font-weight: 700; letter-spacing: 0.22em">CHOREOGRAPHY RESUME ↓</a>
        <a href="#" class="btn-line" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 20px; border: 1px solid #3a3846; font-size: 11px; font-weight: 700; letter-spacing: 0.22em">TEACHING RESUME ↓</a>
      </div>
    </div>
  </div>

  <form style="flex: 1.5 1 520px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 24px 20px; align-content: start; border: 1px solid #22202c; background: #0E0C15; padding: clamp(28px, 4vw, 56px)">
    <fieldset style="grid-column: 1 / -1; border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px">
      <legend style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #A6AAB6; margin-bottom: 14px">WHAT CAN THERESA HELP WITH?</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="5">
          <sc-if value="{{t.on}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{t.pick}}" aria-pressed="true" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #C9A24E; background: #C9A24E; color: #07060D; font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; cursor: pointer">{{t.label}}</button></sc-if>
          <sc-if value="{{t.off}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{t.pick}}" aria-pressed="false" class="btn-line" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #3a3846; background: transparent; color: #FDFEFF; font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; cursor: pointer">{{t.label}}</button></sc-if>
        </sc-for>
      </div>
    </fieldset>
    <div style="display: flex; flex-direction: column; gap: 10px"><label for="c-name" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #A6AAB6">NAME</label><input id="c-name" type="text" style="min-height: 52px; padding: 0 18px; background: #07060D; border: 1px solid #3a3846; color: #FDFEFF; font-family: inherit; font-size: 15px"></div>
    <div style="display: flex; flex-direction: column; gap: 10px"><label for="c-email" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #A6AAB6">EMAIL</label><input id="c-email" type="email" style="min-height: 52px; padding: 0 18px; background: #07060D; border: 1px solid #3a3846; color: #FDFEFF; font-family: inherit; font-size: 15px"></div>
    <div style="display: flex; flex-direction: column; gap: 10px"><label for="c-co" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #A6AAB6">COMPANY / ARTIST</label><input id="c-co" type="text" style="min-height: 52px; padding: 0 18px; background: #07060D; border: 1px solid #3a3846; color: #FDFEFF; font-family: inherit; font-size: 15px"></div>
    <div style="display: flex; flex-direction: column; gap: 10px"><label for="c-date" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #A6AAB6">PROJECT DATE(S)</label><input id="c-date" type="text" placeholder="e.g. late January" style="min-height: 52px; padding: 0 18px; background: #07060D; border: 1px solid #3a3846; color: #FDFEFF; font-family: inherit; font-size: 15px"></div>
    <div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px"><label for="c-msg" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #A6AAB6">TELL US ABOUT THE PROJECT</label><textarea id="c-msg" rows="6" style="padding: 16px 18px; background: #07060D; border: 1px solid #3a3846; color: #FDFEFF; font-family: inherit; font-size: 15px; line-height: 1.5; resize: vertical"></textarea></div>
    <button type="submit" class="btn-gold" style="grid-column: 1 / -1; min-height: 56px; background: #C9A24E; color: #07060D; border: 0; font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.24em; cursor: pointer">SEND MESSAGE</button>
  </form>
</main>

<footer style="border-top: 1px solid #1d1b26">
  <div style="max-width: 1344px; margin: 0 auto; padding: 64px clamp(20px, 4vw, 48px) 48px; display: flex; flex-direction: column; gap: 48px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 32px">
      <img src="assets/theresa-stone-creative-long.png" alt="Theresa Stone Creative" style="display: block; width: 260px; height: auto">
      <div style="display: flex; flex-wrap: wrap; gap: 32px; font-size: 12px; font-weight: 700; letter-spacing: 0.2em">
        <a class="navlink" href="creative-work.html">CREATIVE WORK</a><a class="navlink" href="classes.html">CLASSES</a><a class="navlink inst" href="instincts.html">INSTINCTS</a><a class="navlink" href="contact.html">CONTACT</a>
      </div>
      <div style="display: flex; gap: 8px">
        <a href="https://instagram.com/theresastone91" aria-label="Instagram" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #3a3846; border-radius: 50%"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.6"></circle></svg></a>
        <a href="https://youtube.com/@theresastone5205" aria-label="YouTube" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #3a3846; border-radius: 50%"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4"></rect><path d="M10 9v6l5-3z"></path></svg></a>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 12px; letter-spacing: 0.12em; color: #8A8E9A">
      <span>© 2026 THERESA STONE. ALL RIGHTS RESERVED.</span><span>SITE BY <a href="https://bumpstudio.co" style="color: inherit; text-decoration: underline; text-underline-offset: 3px">BUMP STUDIO</a></span>
    </div>
  </div>
</footer>
</div>
</template>
<script type="text/x-dc" id="dc-script" data-props='{"$preview":{"width":1440,"height":1290}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { type: 'choreo' }; }
  renderVals() {
    const types = [['choreo', 'CHOREOGRAPHY'], ['cd', 'CREATIVE DIRECTION'], ['workshop', 'CLASSES & WORKSHOPS'], ['instincts', 'INSTINCTS'], ['other', 'PRESS / OTHER']];
    return {
      types: types.map(([id, label]) => ({ label, on: this.state.type === id, off: this.state.type !== id, pick: () => this.setState({ type: id }) }))
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
